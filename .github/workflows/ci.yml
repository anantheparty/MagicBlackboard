name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5
        with:
          main-branch-name: main

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Lint code
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - run: npx nx affected -t test build --base=$NX_BASE --head=$NX_HEAD --verbose
      - run: npx nx affected -t e2e --base=$NX_BASE --head=$NX_HEAD --parallel 1 --verbose
